name: GitHub-Profile-Summary-Cards

on:
  schedule: # execute every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: master
          # London. Static offset, so the card reads an hour early during BST.
          UTC_OFFSET: 0
          # Coursework and pre-Apple side projects skew the language cards.
          # Comma-separated, no spaces: the action does not trim entries.
          EXCLUDE_REPOS: "nantral-platform/nantralPlatform,gibiane-vscode,mapping-the-internet,mpar-mdp-vscode,TP-GPGPU,BERT-demo,challenge-STASC,julia_brot,IsOnBoardUp,vosk-server,nx-completion,tree-sitter-xml"
          EXCLUDE: "TeX"
